# Measured hardware values remain unresolved. The simulation_model block contains
# explicitly provisional design values used by the Phase 2/3 simulation model.
robot:
  measurement_status: unresolved_not_measured
  mass_kg: null
  height_m: null
  footprint:
    length_m: null
    width_m: null
  wheel_radius_m: null
  wheel_separation_m: null
  max_linear_velocity_mps: null
  max_angular_velocity_radps: null
  simulation_model:
    status: design_placeholder_not_measured
    note: Replace every value after measuring the physical vehicle; do not use for sim-to-real claims. Footprint includes simulated wheel and caster envelopes.
    chassis_length_m: 0.32
    chassis_width_m: 0.24
    chassis_height_m: 0.08
    chassis_mass_kg: 2.0
    wheel_radius_m: 0.04
    wheel_width_m: 0.025
    wheel_mass_kg: 0.15
    wheel_separation_m: 0.28
    wheel_x_m: -0.04
    max_linear_velocity_mps: 0.25
    max_angular_velocity_radps: 1.0
    odom_publish_frequency_hz: 30.0
    caster_x_m: 0.19
    caster_radius_m: 0.025
    caster_mass_kg: 0.05
    camera_status: provisional_sensor_configured_not_hardware_measured
    footprint_xy_m:
      - [0.215, 0.1525]
      - [0.215, -0.1525]
      - [-0.16, -0.1525]
      - [-0.16, 0.1525]
sensors:
  camera:
    status: provisional_simulation_parameters_not_hardware_measured
    mount_xyz_m: [0.10, 0.0, 0.10]
    mount_rpy_rad: [0.0, 0.0, 0.0]
    link_frame_id: camera_link
    optical_frame_id: camera_optical_frame
    resolution_px: [320, 240]
    horizontal_fov_rad: 1.0471975512
    update_rate_hz: 15.0
    near_clip_m: 0.05
    far_clip_m: 10.0
    pixel_format: R8G8B8
    noise_model: none
    distortion_model: zero_distortion_provisional
    calibration_file: null
    calibration_note: CameraInfo is generated from the simulated pinhole FOV and image dimensions; this is not physical calibration.
  imu:
    status: provisional_simulation_parameters_not_hardware_measured
    mount_xyz_m: [0.0, 0.0, 0.0]
    mount_rpy_rad: [0.0, 0.0, 0.0]
    frame_id: imu_link
    update_rate_hz: 100.0
    gazebo_orientation_output: true
    ros_orientation_available: false
    orientation_policy: Gazebo raw IMU includes pose-derived orientation; the ROS adapter drops it and marks orientation unavailable.
    angular_velocity_noise_stddev_radps: 0.002
    angular_velocity_bias_mean_radps: 0.0
    angular_velocity_bias_stddev_radps: 0.0
    linear_acceleration_noise_stddev_mps2: 0.02
    linear_acceleration_bias_mean_mps2: 0.0
    linear_acceleration_bias_stddev_mps2: 0.0
    covariance_policy: ROS covariance diagonals reflect provisional SDF noise variances; they are not physically calibrated.
mission:
  map_frame: map
  nominal_start_pose_xyyaw: [0.0, 0.0, 0.0]
  baseline_goal_map_xyyaw: [2.0, 0.0, 0.0] # provisional; verify world bounds
  parking_position_tolerance_m: 0.20 # provisional starting target
  parking_yaw_tolerance_deg: 10 # provisional starting target
  parking_dwell_s: 5 # provisional starting target
sensing_profiles:
  - REFERENCE
  - REALISTIC
