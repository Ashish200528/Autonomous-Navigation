slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    # Actual hit endpoints only; no-return rays remain available to safety mapping.
    scan_topic: /realistic/scan/slam_hits
    resolution: 0.05
    max_laser_range: 6.0
    minimum_time_interval: 0.25
    scan_queue_size: 3
    transform_publish_period: 0.05
    # Bounded commissioning needs timely map feedback during a four-second drive.
    map_update_interval: 1.0
    use_scan_matching: true
    use_scan_barycenter: true
    # Resolve slow 0.05 m/s commissioning motion within the 0.05 m grid.
    # Time interval still caps processing at 4 Hz.
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.10
    do_loop_closing: true
