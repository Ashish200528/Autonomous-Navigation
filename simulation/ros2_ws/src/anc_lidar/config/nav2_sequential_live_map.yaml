# Optional experiment: fuse the online SLAM map into the rolling local grid.
# No file map; unknown remains forbidden and measured obstacles take maximum cost.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 8.0
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.4
      required_movement_radius: 0.1
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.08
      stateful: true
    FollowPath:
      plugin: anc_nav2_sequential_controller::SequentialController
      lookahead_dist: 0.6
      linear_speed_mps: 0.08
      angular_speed_radps: 0.05
      path_heading_limit_rad: 0.12
      turn_stop_error_rad: 0.04
      settle_wall_s: 1.25
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.3
      use_astar: true
      allow_unknown: false
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    bt_loop_duration: 100
    default_server_timeout: 20
    enable_stamped_cmd_vel: false
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.015
    feedback: OPEN_LOOP
    max_velocity:
    - 0.12
    - 0.0
    - 0.1
    min_velocity:
    - -0.12
    - 0.0
    - -0.1
    max_accel:
    - 0.2
    - 0.0
    - 0.12
    max_decel:
    - -0.25
    - 0.0
    - -0.12
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_nav
    state_topic: /realistic/collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - StopZone
    StopZone:
      type: polygon
      points: '[[0.30, 0.24], [0.85, 0.24], [0.85, -0.24], [0.30, -0.24]]'
      action_type: stop
      min_points: 1
      visualize: true
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /realistic/scan
      min_height: 0.02
      max_height: 0.5
      enabled: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.215, 0.1525], [0.215, -0.1525], [-0.16, -0.1525], [-0.16, 0.1525]]'
      footprint_padding: 0.04
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /realistic/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.5
          raytrace_max_range: 6.0
          min_obstacle_height: 0.02
          max_obstacle_height: 0.5
          observation_persistence: 0.0
          expected_update_rate: 0.25
        combination_method: 1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        footprint_clearing_enabled: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      resolution: 0.05
      footprint: '[[0.215, 0.1525], [0.215, -0.1525], [-0.16, -0.1525], [-0.16, 0.1525]]'
      footprint_padding: 0.38
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /realistic/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.5
          raytrace_max_range: 6.0
          min_obstacle_height: 0.02
          max_obstacle_height: 0.5
          observation_persistence: 0.0
          expected_update_rate: 0.25
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
route_server:
  ros__parameters:
    use_sim_time: true
