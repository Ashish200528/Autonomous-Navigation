anc_ekf_filter:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    debug: false
    transform_timeout: 0.0
    transform_time_offset: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Gazebo DiffDrive publishes zero covariance. The wheel adapter supplies
    # provisional nonzero velocity variances and marks pose as unused.
    odom0: /odometry/wheel
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Sanitized IMU orientation is unavailable; fuse only angular velocity Z.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
